name: Keep Supabase Alive

on:
  schedule:
    # GitHub disables scheduled workflows in public repos after 60 days
    # without repository activity. This workflow also writes a weekly heartbeat
    # commit with GITHUB_TOKEN so the schedule does not silently stop again.
    #
    # These are intentionally off the top of the hour to reduce dropped runs.
    - cron: '23 4 * * *'
    - cron: '53 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase to prevent hibernation
        run: |
          set -euo pipefail

          endpoint="https://ztpftxwfcppsqosilssq.supabase.co/rest/v1/defender_leaderboard?select=id&limit=1"

          for attempt in 1 2 3; do
            echo "Supabase keep-alive ping ${attempt}/3 at $(date -u)"
            curl --fail --show-error --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 "$endpoint" \
              -H "apikey: sb_publishable_VpBNIGGpvSXkuMYiLv_rDA_fUiptxNC" \
              -H "Authorization: Bearer sb_publishable_VpBNIGGpvSXkuMYiLv_rDA_fUiptxNC" \
              -H "Cache-Control: no-store" \
              -o /dev/null -w "HTTP %{http_code}\n"
            sleep 2
          done

          echo "Supabase keep-alive pings completed at $(date -u)"

      - name: Refresh workflow heartbeat
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail

          # One small commit per week keeps the public repo active enough that
          # GitHub does not auto-disable this scheduled workflow after 60 days.
          if [ "$(date -u +%u)" != "1" ]; then
            echo "Heartbeat commit skipped; today is not Monday UTC."
            exit 0
          fi

          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/supabase-keepalive-heartbeat.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/supabase-keepalive-heartbeat.txt
          git commit -m "Refresh Supabase keepalive heartbeat" || {
            echo "Heartbeat unchanged."
            exit 0
          }
          git push
