name: Keep Supabase Alive

on:
  schedule:
    # Twice daily to survive GitHub Actions schedule delays (7-day pause threshold)
    - cron: '17 4 * * *'
    - cron: '47 16 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent hibernation
        run: |
          curl -sf "https://ztpftxwfcppsqosilssq.supabase.co/rest/v1/defender_leaderboard?select=id&limit=1" \
            -H "apikey: sb_publishable_VpBNIGGpvSXkuMYiLv_rDA_fUiptxNC" \
            -H "Authorization: Bearer sb_publishable_VpBNIGGpvSXkuMYiLv_rDA_fUiptxNC" \
            -o /dev/null -w "HTTP %{http_code}\n"
          echo "Supabase keep-alive ping sent at $(date -u)"
